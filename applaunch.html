<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Encuentra tu calma interior</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --aura-peach: #fdf8f5;
            --aura-sage: #7b8a7e;
            --aura-accent: #d4a373;
            --text-dark: #2d2d2d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--aura-peach); 
            color: var(--text-dark); 
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Navegación */
        nav {
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: var(--aura-sage); }
        
        .back-link { 
            text-decoration: none; color: var(--text-dark); font-size: 0.9rem; 
            border: 1px solid rgba(0,0,0,0.1); padding: 10px 20px; border-radius: 30px;
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 50px 5% 100px;
            gap: 50px;
        }

        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 6vw, 5rem);
            line-height: 1.1;
            margin-bottom: 25px;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
            max-width: 500px;
        }

        /* Simulación de App en iPhone */
        .phone-mockup {
            position: relative;
            width: 300px;
            height: 600px;
            background: #fff;
            border-radius: 40px;
            margin: 0 auto;
            border: 8px solid #2d2d2d;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.1);
        }

        .app-screen {
            padding: 20px;
            background: linear-gradient(180deg, #fdf8f5 0%, #fff 100%);
            height: 100%;
        }

        .app-card {
            background: #f8edeb;
            height: 150px;
            border-radius: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            color: var(--aura-sage);
        }

        .play-btn {
            width: 60px; height: 60px; background: var(--aura-sage);
            border-radius: 50%; margin: 40px auto;
            display: flex; align-items: center; justify-content: center;
        }

        /* Botón de descarga */
        .download-btn {
            background: var(--aura-sage);
            color: white;
            padding: 20px 45px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: 0.3s;
        }

        .download-btn:hover { background: var(--aura-accent); transform: translateY(-3px); }

        @media (max-width: 900px) {
            .hero { grid-template-columns: 1fr; text-align: center; }
            .hero-content p { margin: 0 auto 40px; }
        }
    </style>
</head>
<body>

    <nav>
        <span class="logo">Aura</span>
        <a href="index.html" class="back-link">Cerrar Demo</a>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>Respira profundo, <i>suelta</i> todo.</h1>
            <p>La aplicación de meditación diseñada para reconectar con tu paz interior a través de paisajes sonoros y guías personalizadas.</p>
            <a href="#" class="download-btn">Empezar gratis</a>
        </div>

        <div class="phone-mockup">
            <div class="app-screen">
                <div style="margin-top: 20px; font-weight: 700;">Buenas tardes,</div>
                <div style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 25px;">¿Qué necesitas hoy?</div>
                
                <div class="app-card">Meditación Guiada</div>
                <div class="app-card" style="background: #e9edc9;">Sonidos de Lluvia</div>
                
                <div class="play-btn">
                    <div style="width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-left: 15px solid white; margin-left: 5px;"></div>
                </div>
                
                <div style="text-align: center; font-size: 0.7rem; letter-spacing: 2px;">08:45 / 15:00</div>
            </div>
        </div>
    </section>

</body>
</html>
